// RetroFuturaGradle 插件只在 GTNH 仓库发布，必须在这里声明
pluginManagement {
    repositories {
        maven {
            name = "GTNH Maven"
            url = uri("https://nexus.gtnewhorizons.com/repository/public/")
            allowInsecureProtocol = true
            mavenContent {
                includeGroup("com.gtnewhorizons")
                includeGroup("com.gtnewhorizons.retrofuturagradle")
            }
        }
        gradlePluginPortal()
        mavenCentral()
        mavenLocal()
    }
}

plugins {
    // 自动下载 Java 8 工具链（编译目标为 8，但 Gradle 自身可能跑在更高版本上）
    id("org.gradle.toolchains.foojay-resolver-convention") version "1.0.0"
}

// 与 Aqua 不同：这里写死，避免依赖 gradle.properties 在 settings 阶段是否已加载
rootProject.name = "ParCool"
